services:
  - type: web
    name: beautyos-api
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/warosc/beatyos.git
    branch: main
    autoDeployTrigger: commit
    # El plan gratuito limita el proceso web a 256 MB. ts-node puede superar ese límite
    # durante el seed, por eso migraciones y datos iniciales se ejecutan en el build.
    buildCommand: npm ci --ignore-scripts --ignore-workspaces && npm run prisma:generate && npm run build && npm run prisma:deploy && npm run db:seed
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Entorno de demostración: crea el salón y los usuarios documentados por el seed.
      # Cambiar a production antes de usar datos reales.
      - key: NODE_ENV
        value: development
      - key: API_PREFIX
        value: api
      - key: DATABASE_URL
        fromDatabase:
          name: beautyos-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: JWT_ISSUER
        value: beautyos-cloud-test
      - key: JWT_AUDIENCE
        value: beautyos-api
      - key: CORS_ORIGINS
        value: https://beautyos-web.vercel.app
      - key: SWAGGER_ENABLED
        value: 'true'
      - key: SWAGGER_PATH
        value: api/docs
      - key: LOG_LEVEL
        value: info
      - key: DEFAULT_CURRENCY
        value: GTQ
      - key: DEFAULT_TIMEZONE
        value: America/Guatemala
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PORT
        value: '443'
      - key: S3_USE_SSL
        value: 'true'
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: beautyos-media
      - key: S3_REGION
        value: auto

databases:
  - name: beautyos-db
    plan: free
    region: oregon
    databaseName: beautyos
    user: beautyos
    ipAllowList: []
