name: appsalonbelleza

services:
  postgres:
    image: postgres:16-alpine
    container_name: salon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salon_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-salon}
      # Colacion determinista: evita que un cambio de locale del contenedor
      # reordene indices existentes y corrompa busquedas por rango.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=es-ES --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-salon} -d ${POSTGRES_DB:-salon}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Instancia separada para la suite de integracion (ADR-0009). Vive en tmpfs:
  # los tests destruyen y recrean el esquema constantemente y no queremos ni el
  # coste de disco ni el riesgo de contaminar la base de desarrollo.
  postgres-test:
    image: postgres:16-alpine
    container_name: salon-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: salon_test
      POSTGRES_PASSWORD: salon_test
      POSTGRES_DB: salon_test
    ports:
      - '${POSTGRES_TEST_PORT:-5443}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    command: >
      postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
               -c max_connections=200
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U salon_test -d salon_test']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    profiles: ['test', 'dev']

  # Almacen de objetos compatible con S3 (ADR-0016).
  #
  # Las fotos no van en PostgreSQL. Un `bytea` de tres megas por foto infla las copias de
  # seguridad, se pasea entero en cada consulta que olvide excluir la columna y convierte un
  # `pg_dump` de minutos en uno de horas. Un almacen de objetos hace exactamente esto y la
  # base guarda solo la referencia.
  #
  # MinIO habla el protocolo de S3, asi que pasar a S3, R2 o Spaces en produccion es cambiar
  # tres variables de entorno y ninguna linea de codigo.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: salon-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-salon_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-salon_minio_dev_password}
      # Sin esto, MinIO permite subir objetos que el navegador interpretaria como HTML.
      MINIO_BROWSER: 'on'
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: salon-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # El compose local acepta credenciales de desarrollo. En producción se debe
      # exportar NODE_ENV=production y proporcionar secretos JWT reales.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-salon}:${POSTGRES_PASSWORD:-salon_dev_password}@postgres:5432/${POSTGRES_DB:-salon}?schema=public&connection_limit=10
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET es obligatorio}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET es obligatorio}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Dentro de la red de compose el almacen se llama `minio`, no `localhost`. La
      # variable del `.env` apunta a localhost porque es lo correcto para la suite de
      # integracion, que corre en el host; aqui se sobrescribe.
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_USE_SSL: 'false'
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-salon_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-salon_minio_dev_password}
      S3_BUCKET: ${S3_BUCKET:-salon-media}
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3000/api/v1/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: ['full']

  # Interfaz web servida desde el contenedor. Es una *alternativa* a `npm run web:dev`, no
  # un complemento: ambos quieren el 3001.
  #
  # La colision no falla de forma ruidosa. Si el `next dev` del host ya tiene el puerto,
  # Docker Desktop arranca el contenedor igual y deja el binding vacio: `docker compose ps`
  # lo muestra `Up` mientras es inalcanzable desde el host, y el navegador sigue hablando
  # con el proceso local. Se ha llegado a dar por validado un cambio contra el proceso
  # equivocado por esto. Si se levanta el perfil `full`, hay que parar antes el dev local
  # —o darle otro puerto con WEB_PORT—; para volver al desarrollo con recarga en caliente,
  # `docker compose --profile full stop web` (queda parado pese a `unless-stopped`).
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: salon-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3000/api/v1
      COOKIE_SECURE: 'false'
    ports:
      - '${WEB_PORT:-3001}:3001'
    profiles: ['full']

volumes:
  postgres-data:
  minio-data:
    driver: local
